services:
  - type: web
    name: codementorx-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PORT
        value: 5000
      # Required secrets to be set in the Render Dashboard manually
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DOGRAH_PYTHON_AGENT_ID
        sync: false
      - key: DOGRAH_CPP_AGENT_ID
        sync: false
      - key: DOGRAH_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
